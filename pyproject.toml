[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-health-signals"
version = "0.1.0"
description = "Deterministic follow-up questions, patterns and red flags from a cat's health log."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]
keywords = ["cats", "pets", "health", "veterinary", "mcp"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["cat_health_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
